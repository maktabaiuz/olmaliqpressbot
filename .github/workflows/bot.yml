name: OlmaliqpressBot - Automated Posting

on:
  schedule:
    # Her 6 soatda ishga tushadi
    - cron: '0 */6 * * *'
  # Manual trigger uchun
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=gemini-3.5-flash
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHANNEL=${{ secrets.TARGET_CHANNEL }}
          TARGET_CHANNEL_RU=${{ secrets.TARGET_CHANNEL_RU }}
          TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION=${{ secrets.TELEGRAM_SESSION }}
          DATABASE_PATH=data/news.db
          LOG_FILE=logs/bot.log
          EOF

      - name: Create data directory
        run: mkdir -p data logs

      - name: Run bot in test mode
        run: python3 main.py --test
        continue-on-error: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bot-logs
          path: logs/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Bot faoliyatida xatolik yuz berdi"
          echo "Logs qo'ruing: Actions tab'da"
